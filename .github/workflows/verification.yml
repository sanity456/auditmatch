name: AuditMatch verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Contract and expiry regression (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned contract tooling
        run: python -m pip install -r requirements.txt
      - name: Validate intelligent contract
        run: genvm-lint check contracts/audit_match.py --json
      - name: Show expiry regression evidence
        run: |
          python -m pytest tests/direct/test_audit_match.py::test_expired_assessment_fails_without_mutating_history -q -s | tee expiry-regression.log
          {
            echo "## Expiry regression"
            echo '```text'
            grep 'EXPIRY_REGRESSION_EVIDENCE=' expiry-regression.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run clean direct suite
        run: python -m pytest tests/direct -q

  frontend:
    name: Frontend and release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
